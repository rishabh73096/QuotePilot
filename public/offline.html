<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>No internet connection</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1026;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{max-width:420px;width:100%;text-align:center;background:#fff;color:#0f1129;border-radius:28px;padding:40px 28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
  .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:22px;background:#fde0e0;color:#c2262e;display:flex;align-items:center;justify-content:center;position:relative}
  .icon::after{content:"";position:absolute;inset:0;border-radius:22px;background:#e5484d;opacity:.4;animation:ping 1.8s ease-out infinite}
  @keyframes ping{from{transform:scale(1);opacity:.4}to{transform:scale(1.5);opacity:0}}
  h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
  p{margin:0 0 24px;color:#64748b;line-height:1.55;font-size:15px}
  button{appearance:none;border:0;cursor:pointer;height:46px;padding:0 28px;border-radius:999px;background:#e8590c;color:#fff;font-size:15px;font-weight:600;transition:transform .15s}
  button:hover{transform:translateY(-1px)} button:active{transform:scale(.96)}
  small{display:block;margin-top:18px;color:#94a3b8;font-size:12px}
  @media (prefers-reduced-motion:reduce){.icon::after{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.6-1.9"/><path d="M2 8.8a15 15 0 0 1 4.2-2.7"/><path d="M22 8.8a15 15 0 0 0-8-3.7"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>No internet connection</h1>
    <p>Check your Wi-Fi or mobile data and try again. Your quotes are safe and will load once you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>QuotePilot AI</small>
  </main>
  <script>window.addEventListener("online",function(){location.reload()})</script>
</body>
</html>
